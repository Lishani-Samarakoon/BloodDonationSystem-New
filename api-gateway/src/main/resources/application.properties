server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.auth.api-key=${AUTH_SERVICE_API_KEY:auth-service-secret-key}
services.donation.url=${DONATION_SERVICE_URL:http://localhost:8082}
services.donation.api-key=${DONATION_SERVICE_API_KEY:donation-service-secret-key}
services.bloodbank.url=${BLOODBANK_SERVICE_URL:http://localhost:8083}
services.bloodbank.api-key=${BLOODBANK_SERVICE_API_KEY:bloodbank-service-secret-key}

# The issuer must match the value inside browser-issued Keycloak tokens.
# jwk-set-uri can use an internal Docker hostname so the Gateway can still fetch signing keys.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER:http://localhost:8180/realms/blood-donation}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWK_SET_URI:http://localhost:8180/realms/blood-donation/protocol/openid-connect/certs}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:20}
rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:10}

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
management.endpoints.web.exposure.include=health,info
